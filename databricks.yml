bundle:
  name: information-extraction-review

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog catalog name"
    default: "cedip_fevm_aws_classic_stable_catalog"
  schema:
    description: "Unity Catalog schema name"
    default: "ai"
  pdf_folder_path:
    description: "Full volume path to the folder that contains the PDFs to process"
    default: "/Volumes/cedip_fevm_aws_classic_stable_catalog/ai/techfin_raw_files/input_files/"
  warehouse_id:
    description: "SQL warehouse ID for the app and pipeline"
    default: "2c3975c5e258e46b"
  endpoint_name:
    description: "Agent Bricks model serving endpoint for information extraction (ai_query)"
    default: "kie-76e4b503-endpoint"

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: fevm

  prod:
    mode: production
    workspace:
      profile: fevm
