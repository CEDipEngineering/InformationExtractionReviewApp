bundle:
  name: techfin-ocr-balancos

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog catalog name"
    default: "cedip_fevm_aws_classic_stable_catalog"
  schema:
    description: "Schema for reads (source tables)"
    default: "ai"
  write_schema:
    description: "Schema for pipeline output tables"
    default: "ai"
  pdf_volume_path:
    description: "Full volume path to the folder containing PDFs to process"
    default: "/Volumes/cedip_fevm_aws_classic_stable_catalog/ai/techfin_raw_files/input_files/"
  warehouse_id:
    description: "SQL warehouse ID for the app and pipeline"
    default: "2c3975c5e258e46b"
  endpoint_name:
    description: "Foundation Model API endpoint for financial extraction (ai_query)"
    default: "databricks-claude-3-7-sonnet"

  tag_project:
    description: "Tag: project name applied to all resources"
    default: "techfin-ocr"
  tag_env:
    description: "Tag: environment (defaults to bundle target name)"
    default: ${bundle.target}

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: fevm
    variables:
      schema: techfin_balanco
      write_schema: techfin_balanco
      pdf_volume_path: /Volumes/cedip_fevm_aws_classic_stable_catalog/techfin_balanco/techfin_raw_files/input_files/

  prod:
    mode: production
    workspace:
      profile: fevm
      root_path: "/Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}"
    variables:
      write_schema: ai_prod

  azdev:
    mode: development
    workspace:
      host: https://adb-7405613524140009.9.azuredatabricks.net
      profile: azfevm
    variables:
      catalog: catalog_nqc8lc_8uoefp
      schema: ai
      write_schema: ai
      warehouse_id: 970182bc1a3cc5a0
      pdf_volume_path: /Volumes/catalog_nqc8lc_8uoefp/ai/techfin_raw_files/input_files/
