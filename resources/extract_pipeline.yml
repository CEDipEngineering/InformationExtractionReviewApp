resources:
  pipelines:
    extract_pipeline:
      name: "[${bundle.target}] TechFin Extract Financial Fields"

      catalog: ${var.catalog}
      schema: ${var.write_schema}

      serverless: true

      libraries:
        - notebook:
            path: ../src/pipelines/extract_fields/transformations/extract_fields.py

      configuration:
        endpoint_name: ${var.endpoint_name}
        source_table: ${var.catalog}.${var.write_schema}.raw_parsed_content
        schema_ws_path: ${workspace.file_path}/src/agents/extractor/output_schema.json

      continuous: false
      channel: PREVIEW  # Required for ai_query against FMAPI endpoints

      tags:
        env: ${var.tag_env}
        project: ${var.tag_project}
        data_processing_step: extraction
