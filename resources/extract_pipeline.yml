resources:
  pipelines:
    extract_pipeline:
      name: "[${bundle.target}] Extract Financial Fields"

      catalog: ${var.catalog}
      target: ${var.schema}

      serverless: true

      libraries:
        - glob:
            include: ../src/pipelines/extract_fields/transformations/**
      root_path: ../src/pipelines/extract_fields

      configuration:
        endpoint_name: ${var.endpoint_name}
        # Full table name of the parse pipeline output; resolved at deploy time.
        source_table: ${var.catalog}.${var.schema}.raw_parsed_content

      continuous: false
      channel: PREVIEW
