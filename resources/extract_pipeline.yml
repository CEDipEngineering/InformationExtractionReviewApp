resources:
  pipelines:
    extract_pipeline:
      name: "[${bundle.target}] Extract Financial Fields"

      catalog: ${var.catalog}
      schema: ${var.write_schema}

      serverless: true

      libraries:
        - notebook:
            path: ../src/pipelines/extract_fields/transformations/extract_fields.py

      configuration:
        endpoint_name: ${var.endpoint_name}
        source_table: ${var.catalog}.${var.schema}.raw_parsed_content

      continuous: false
      channel: PREVIEW  # Required for ai_query against custom model serving endpoints

      tags:
        env: ${var.tag_env}
        project: ${var.tag_project}
        data_processing_step: extraction
