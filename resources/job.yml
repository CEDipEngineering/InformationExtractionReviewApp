resources:
  jobs:
    extraction_job:
      name: "[${bundle.target}] TechFin OCR Balanços"

      tags:
        env: ${var.tag_env}
        project: ${var.tag_project}

      queue:
        enabled: true

      performance_target: PERFORMANCE_OPTIMIZED

      tasks:
        - task_key: parse_pdfs
          notebook_task:
            notebook_path: ../src/pipelines/parse_pdfs/parse_pdfs_notebook.py
            source: WORKSPACE
            base_parameters:
              pdf_volume_path: ${var.pdf_volume_path}
              catalog: ${var.catalog}
              schema: ${var.schema}
              write_schema: ${var.write_schema}

        - task_key: extract_fields
          depends_on:
            - task_key: parse_pdfs
          pipeline_task:
            pipeline_id: ${resources.pipelines.extract_pipeline.id}

        - task_key: process_results
          depends_on:
            - task_key: extract_fields
          notebook_task:
            notebook_path: ../src/pipelines/process_results/process_results_notebook.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              write_schema: ${var.write_schema}
